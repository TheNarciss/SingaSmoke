name: Data

# Regenerates the bundled data from the open sources, checks it (scripts/check.mjs), commits it
# to the branch it runs on and starts a TestFlight build. Monthly, so the app stays current and a
# fresh build lands before TestFlight's 90-day expiry; or on demand with "Run workflow".

on:
  schedule:
    - cron: "23 2 1 * *"   # the 1st of each month, 10:23 in Singapore
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Fetch, geocode, build and check the data
        run: npm run data

      - name: Commit the new data
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SingaSmoke/Resources/Data data/sources
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh from NEA, NParks, HSA, Changi and OpenStreetMap ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN starts no workflow on its own; a dispatch does.
      - name: Build the app with the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ios.yml --ref "${{ github.ref_name }}" -f testflight=true

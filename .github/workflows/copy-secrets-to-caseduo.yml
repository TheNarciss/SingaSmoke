name: Copier les secrets iOS vers CaseDuo
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the signing secrets to TheNarciss/caseduo
        env:
          GH_TOKEN: ${{ secrets.CASEDUO_SECRETS_TOKEN }}
          P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          for pair in IOS_CERTIFICATE_P12_B64:P12_B64 IOS_CERTIFICATE_PASSWORD:P12_PASSWORD APPSTORE_API_KEY_ID:KEY_ID APPSTORE_API_ISSUER_ID:ISSUER_ID APPSTORE_API_KEY_P8_B64:KEY_P8_B64; do
            name="${pair%%:*}"; var="${pair##*:}"
            if [ -z "${!var}" ]; then echo "::error::$name absent de SingaSmoke"; exit 1; fi
            printf '%s' "${!var}" | gh secret set "$name" -R TheNarciss/caseduo
            echo "$name copié"
          done

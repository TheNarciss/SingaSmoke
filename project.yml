# The Xcode project, described as text. `xcodegen generate` turns it into SingaSmoke.xcodeproj
# (not committed: CI generates it on every build). Nobody needs to open Xcode.
name: SingaSmoke

options:
  bundleIdPrefix: uk.riskybusinesses
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  SingaSmokeCore:
    path: Packages/SingaSmokeCore

targets:
  SingaSmoke:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SingaSmoke
        excludes:
          - "Resources/Data"
          - "Resources/Data/**"
      # A folder reference: the GeoJSON files land in SingaSmoke.app/Data/.
      - path: SingaSmoke/Resources/Data
        type: folder
        buildPhase: resources
    dependencies:
      - package: SingaSmokeCore
    configFiles:
      Debug: SingaSmoke/Config/Signing.xcconfig
      Release: SingaSmoke/Config/Signing.xcconfig
    info:
      path: SingaSmoke/Info.plist
      properties:
        CFBundleDisplayName: SingaSmoke
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.navigation
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: >-
          SingaSmoke uses your location only while the app is open, to tell you whether you are in a
          no-smoking zone and to find the nearest place where smoking is allowed. It never leaves your phone.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.riskybusinesses.singasmoke
        PRODUCT_NAME: SingaSmoke
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  SingaSmoke:
    build:
      targets:
        SingaSmoke: all
    run:
      config: Debug
    archive:
      config: Release
